<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>找不到這個頁面｜YUHSIN 祐馨升學網</title>
  <link rel="icon" href="/admitpath-tw/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/admitpath-tw/favicon-32.png">
  <style>
    :root { --ink: #17202d; --muted: #667085; --side: #102033; --teal: #39b7a9; --dark: #071d27; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: var(--ink);
      background: linear-gradient(180deg, #f5f8fc 0%, #edf2f7 100%);
      font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", Arial, sans-serif;
    }
    main {
      width: min(460px, 100%);
      padding: 36px 28px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 48px rgba(22, 32, 45, .12);
      text-align: center;
    }
    .mark {
      width: 56px; height: 56px; margin: 0 auto 18px;
      display: grid; place-items: center;
      border-radius: 14px; background: var(--teal); color: var(--dark);
      font-size: 30px; font-weight: 900;
    }
    h1 { margin: 0 0 10px; font-size: 1.5rem; }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.7; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    a {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 0 18px; border-radius: 10px;
      font-weight: 700; text-decoration: none;
    }
    a.primary { background: var(--side); color: #fff; }
    a.secondary { border: 1px solid #d4dde8; color: var(--ink); }
    a:focus-visible { outline: 3px solid rgba(57, 183, 169, .45); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">Y</div>
    <h1>找不到這個頁面</h1>
    <p>網址可能打錯了，或頁面已經搬家。<br>從首頁重新開始找校系吧。</p>
    <nav aria-label="回到網站">
      <a class="primary" href="/admitpath-tw/">回到首頁</a>
      <a class="secondary" href="/admitpath-tw/#workbench">校系查詢</a>
      <a class="secondary" href="/admitpath-tw/#placement">落點分析</a>
    </nav>
  </main>
</body>
</html>
