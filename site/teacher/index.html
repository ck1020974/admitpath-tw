<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <title>教師後台｜YUHSIN 祐馨升學網</title>
  <link rel="stylesheet" href="./teacher.css?v=20261030-rv1">
  <script defer src="../student-auth-config.js?v=20261029-auth1"></script>
  <script defer src="../student-supabase.js?v=20261030-rv1"></script>
  <script defer src="../explore/curiosity/bank.js?v=20261029-records1"></script>
  <script defer src="../explore/curiosity/collego-reference.js?v=20261029-records1"></script>
  <script defer src="../explore/curiosity/curriculum.js?v=20261029-records1"></script>
  <script defer src="../explore/curiosity/units.js?v=20261029-records1"></script>
  <script defer src="../explore/curiosity/subjects.js?v=20261029-records1"></script>
  <script defer src="../explore/curiosity/exploration-model.js?v=20261029-records1"></script>
  <script defer src="../explore/curiosity/data.js?v=20261029-records1"></script>
  <script defer src="./teacher-model.js?v=20261030-rv1"></script>
  <script defer src="./teacher.js?v=20261030-rv1"></script>
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <a class="brand" href="../" aria-label="回到祐馨升學網首頁"><span class="brand-mark" aria-hidden="true">Y</span><span class="brand-text"><strong>YUHSIN</strong><span>祐馨升學網</span></span></a>
    <button id="logout" type="button" class="round-button" aria-label="登出教師後台" title="登出" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M9 12h10"/></svg></button>
  </div></header>
  <main>
    <div class="page-head">
      <h1>教師後台</h1>
      <div id="filters" class="filters" role="group" aria-label="篩選學生" hidden>
        <select id="grade" aria-label="年級"><option value="">年級</option></select>
        <select id="group" aria-label="班群"><option value="">班群</option></select>
        <label class="search"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.3 3.3"/></svg><input id="search" type="search" autocomplete="off" placeholder="搜尋姓名或學號" aria-label="搜尋姓名或學號"></label>
      </div>
    </div>
    <p id="status" role="status">正在確認登入狀態…</p>
    <section id="login" class="login" aria-labelledby="loginTitle" hidden>
      <h2 id="loginTitle">教師登入</h2>
      <p>使用授權的教師帳號查看學生名單。</p>
      <form method="post">
        <label>帳號<input name="username" autocomplete="username" pattern="[A-Za-z][A-Za-z0-9]{5,31}" maxlength="32" spellcheck="false" autocapitalize="off" required></label>
        <label>密碼<input name="password" type="password" autocomplete="current-password" maxlength="128" required></label>
        <label class="show"><input id="showPassword" type="checkbox">顯示密碼</label>
        <p id="loginError" role="alert" hidden></p>
        <button type="submit">登入教師後台</button>
      </form>
    </section>
    <section id="workspace" aria-labelledby="rosterTitle" hidden>
      <section class="roster-panel" aria-labelledby="rosterTitle">
        <h2 id="rosterTitle" class="visually-hidden">學生名單</h2>
        <div class="overview">
          <div id="overviewRows" class="stat-groups">
            <div class="stat-group"><span class="row-label" id="examLabel">探索</span><div id="examPills" class="pills" role="group" aria-labelledby="examLabel"></div></div>
            <div class="stat-group"><span class="row-label" id="loginLabel">登入</span><div id="loginPills" class="pills" role="group" aria-labelledby="loginLabel"></div></div>
          </div>
          <p id="summaryStatus" role="status" hidden></p>
        </div>
        <div class="table-wrap" role="region" aria-label="學生名單" tabindex="0"><table>
          <thead><tr><th scope="col" class="c-name">姓名 <span id="count" class="head-count" role="status"></span></th><th scope="col" id="groupHead" class="c-group">班群</th><th scope="col" class="c-exam">優先學群</th><th scope="col" class="num c-track" aria-sort="none" data-sort="tracking"><button type="button" class="sort-button">追蹤校系</button></th><th scope="col" class="c-login" aria-sort="none" data-sort="login"><button type="button" class="sort-button">最後登入</button></th><th scope="col" class="c-chev"><span class="visually-hidden">開啟</span></th></tr></thead>
          <tbody id="students"></tbody>
        </table></div>
        <p id="empty" hidden>沒有符合條件的學生。</p>
      </section>
    </section>
    <dialog id="studentDialog" class="student-dialog" aria-labelledby="detailTitle">
      <div class="dialog-head">
        <div class="student-heading"><h2 id="detailTitle" tabindex="-1"></h2><p id="detailIdentity" class="identity"></p></div>
        <div class="dialog-nav">
          <button id="prevStudent" type="button" class="round-button" aria-label="上一位學生" title="上一位">‹</button>
          <button id="nextStudent" type="button" class="round-button" aria-label="下一位學生" title="下一位">›</button>
          <button id="closeDialog" type="button" class="dialog-close" aria-label="關閉">×</button>
        </div>
      </div>
      <div class="dialog-tabs" role="tablist" aria-label="學生資料">
        <button id="tabTracking" type="button" role="tab" aria-controls="panelTracking" aria-selected="true">追蹤清單 <span id="tabTrackingCount" class="tab-count"></span></button>
        <button id="tabResults" type="button" role="tab" aria-controls="panelResults" aria-selected="false" tabindex="-1">探索結果 <span id="tabResultsCount" class="tab-count"></span></button>
      </div>
      <div class="dialog-body">
        <p id="detailStatus" role="status" hidden></p>
        <section id="panelTracking" role="tabpanel" aria-labelledby="tabTracking"><div id="detailTracking"></div></section>
        <section id="panelResults" role="tabpanel" aria-labelledby="tabResults" hidden><div id="detailResults"></div></section>
      </div>
    </dialog>
  </main>
  <noscript>請開啟 JavaScript 以使用教師登入。</noscript>
</body></html>
