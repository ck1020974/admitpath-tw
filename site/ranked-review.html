<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>個申篩選順位缺漏覆核</title>
  <link rel="stylesheet" href="./review.css?v=20260628-15">
</head>
<body>
  <main class="review-shell">
    <aside class="review-list-panel">
      <header class="review-head">
        <div>
          <p>114-115 個人申請</p>
          <h1>篩選順位缺漏覆核</h1>
        </div>
        <a href="./index.html">回查詢網站</a>
      </header>

      <section class="review-tools">
        <input id="keywordInput" type="search" placeholder="搜尋學校、科系、代碼、缺漏順位">
        <select id="yearFilter">
          <option value="all">全部年度</option>
          <option value="115">115</option>
          <option value="114">114</option>
        </select>
        <select id="doneFilter">
          <option value="all">全部進度</option>
          <option value="pending">尚未填寫</option>
          <option value="done">已填寫</option>
        </select>
        <select id="externalFilter">
          <option value="all">全部比對狀態</option>
          <option value="auto_fill_candidate">可自動補齊</option>
          <option value="partial_fill_candidate">可部分補齊</option>
          <option value="source_conflict">來源衝突</option>
          <option value="no_university_tw_record">外部無校系</option>
          <option value="no_university_tw_result">外部無結果</option>
          <option value="no_matching_fill">無對應補值</option>
        </select>
      </section>

      <section class="review-counts" id="reviewCounts"></section>
      <section class="review-list" id="reviewList"></section>
    </aside>

    <section class="review-detail">
      <header class="detail-top">
        <div>
          <p id="detailMeta">--</p>
          <h2 id="detailTitle">請選擇一筆資料</h2>
        </div>
        <div class="detail-actions">
          <button id="prevButton" type="button">上一筆</button>
          <button id="nextButton" type="button">下一筆</button>
          <button id="exportJsonButton" type="button">匯出 JSON</button>
          <button id="exportCsvButton" type="button">匯出 CSV</button>
        </div>
      </header>

      <section class="crop-card">
        <div class="crop-toolbar">
          <strong>官方表格裁切</strong>
          <div>
            <button id="zoomOutButton" type="button">縮小</button>
            <button id="zoomInButton" type="button">放大</button>
            <a id="officialImageLink" href="#" target="_blank" rel="noreferrer noopener">開官方整張圖</a>
          </div>
        </div>
        <div class="crop-stage" id="cropStage">
          <img id="cropImage" alt="官方表格裁切圖">
          <div class="no-crop" id="noCrop">此筆未能自動定位裁切圖，請開官方整張圖後用系組代碼查找。</div>
        </div>
      </section>

      <section class="data-grid">
        <article>
          <h3>目前判讀</h3>
          <div class="kv"><span>已讀順位</span><pre id="rankedKnown">--</pre></div>
          <div class="kv"><span>缺漏順位</span><pre id="missingRanks">--</pre></div>
          <div class="kv"><span>官方結果</span><pre id="officialResult">--</pre></div>
          <div class="kv"><span>OCR 原文</span><pre id="ocrRaw">--</pre></div>
          <a id="detailUrl" href="#" target="_blank" rel="noreferrer noopener">開校系分則頁</a>
        </article>

        <article>
          <h3>外部比對</h3>
          <div class="kv"><span>狀態</span><strong id="externalStatus">--</strong></div>
          <div class="kv"><span>UTW 結果</span><pre id="universityTwResult">--</pre></div>
          <div class="kv"><span>建議補值</span><pre id="suggestedFill">--</pre></div>
          <div class="kv"><span>衝突原因</span><pre id="externalConflicts">--</pre></div>
          <a id="universityTwUrl" href="#" target="_blank" rel="noreferrer noopener">開 University TW</a>
        </article>

        <article>
          <h3>人工覆核</h3>
          <label>
            <span>完整順位結果</span>
            <input id="correctedRankedResult" type="text" placeholder="例：國文 13、數A+社會+自然 43、國文+數A+社會+自然 58">
          </label>
          <label>
            <span>分類</span>
            <select id="correctionType">
              <option value="">未選擇</option>
              <option value="completed">已補齊順位</option>
              <option value="official_blank">官方未列分數</option>
              <option value="ocr_unclear">OCR 仍待確認</option>
              <option value="special">術科考試</option>
            </select>
          </label>
          <label>
            <span>備註</span>
            <textarea id="correctionNote" rows="4" placeholder="例：自然欄官方為羅馬數字Ⅱ，非分數。"></textarea>
          </label>
          <div class="form-actions">
            <button id="saveButton" type="button">儲存此筆</button>
            <button id="clearButton" type="button">清除此筆</button>
          </div>
        </article>
      </section>
    </section>
  </main>
  <script src="./ranked-review.js?v=20260628-3"></script>
</body>
</html>
